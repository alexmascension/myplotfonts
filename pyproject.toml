[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myplotfonts"
version = "0.1.0"
description = "TeX Gyre Heros fonts for Matplotlib plots"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.8"]

[tool.setuptools]
py-modules = ["myplotfonts"]
